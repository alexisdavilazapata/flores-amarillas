  .marco::before,.marco::after{content:"";position:absolute;width:64px;height:64px;opacity:.55;
    border:1px solid rgba(255,212,71,.55)}
  .marco::before{top:0;left:0;border-right:0;border-bottom:0}
  .marco::after{bottom:0;right:0;border-left:0;border-top:0}
  @keyframes entrar{from{opacity:0;transform:translateY(28px);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}

  .epigrafe{font-size:.8rem;letter-spacing:.42em;text-transform:uppercase;color:rgba(255,243,176,.75);
    margin-bottom:18px;font-family:'Cormorant Garamond',serif}
  h1{font-size:clamp(2.2rem,7vw,4rem);font-weight:600;line-height:1.1;color:#fff;
    background:linear-gradient(100deg,#fff3b0,#ffd447 35%,#fff 50%,#ffb300 70%,#fff3b0);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    background-size:220% 100%;animation:brillo 7s linear infinite;
    filter:drop-shadow(0 0 22px rgba(255,214,90,.45))}
  @keyframes brillo{to{background-position:220% 0}}
  .sub{margin-top:20px;font-size:clamp(1.05rem,3.2vw,1.45rem);font-style:italic;font-weight:300;
    line-height:1.75;color:#fff8e1;text-shadow:0 2px 18px rgba(0,0,0,.85);
    animation:entrar 2.2s cubic-bezier(.2,.8,.3,1) .5s both}
  .linea{width:0;height:1px;margin:26px auto 0;background:linear-gradient(90deg,transparent,var(--oro),transparent);
    animation:crecerLinea 2s ease 1.1s forwards}
  @keyframes crecerLinea{to{width:220px}}
  .firma{margin-top:18px;font-family:Caveat,cursive;font-size:1.6rem;color:var(--oro);opacity:0;
    animation:entrar 1.6s ease 1.6s both}

  .pista{position:absolute;bottom:26px;left:0;right:0;text-align:center;z-index:5;
    font-size:.85rem;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,248,225,.55);
    animation:latido 3.2s ease-in-out infinite}
  @keyframes latido{0%,100%{opacity:.35}50%{opacity:.85}}

  @media (prefers-reduced-motion:reduce){*{animation:none!important}.linea{width:220px}}
</style>
</head>
<body>

  <div class="fondo" id="fondo"></div>
  <div class="aurora"></div>
  <div class="vineta"></div>
  <canvas id="galaxyCanvas"></canvas>

  <div class="content">
    <div class="marco">
      <div class="epigrafe">Para alguien especial</div>
      <h1 id="titulo">Una galaxia de flores amarillas</h1>
      <p class="sub">En el universo de las cosas hermosas, tú brillas como un campo de girasoles encendido bajo la Vía Láctea: imposible de mirar sin quedarse en silencio.</p>
      <div class="linea"></div>
      <div class="firma">— para ti, siempre 🌻</div>
    </div>
  </div>

  <p class="pista">Toca el cielo para encender más luz</p>

<script>
const canvas=document.getElementById('galaxyCanvas');
const ctx=canvas.getContext('2d');
let W,H,dpr=Math.min(devicePixelRatio||1,2);
function resize(){W=canvas.width=innerWidth*dpr;H=canvas.height=innerHeight*dpr;
  canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';}
addEventListener('resize',resize);resize();

const TONOS=['#fff176','#ffee58','#fdd835','#ffb300','#ffffff','#ffe0a3'];
const rnd=(a,b)=>a+Math.random()*(b-a);

/* ── polen dorado que asciende ── */
class Polen{
  constructor(inicio){this.reset(inicio)}
  reset(inicio){
    this.x=rnd(0,W); this.y=inicio?rnd(0,H):H+rnd(0,60*dpr);
    this.r=rnd(0.6,2.6)*dpr; this.vy=-rnd(0.12,0.75)*dpr; this.vx=rnd(-.18,.18)*dpr;
    this.fase=rnd(0,Math.PI*2); this.vel=rnd(.006,.02);
    this.color=TONOS[(Math.random()*TONOS.length)|0]; this.deriva=rnd(.3,1.4)*dpr;
  }
  update(){ this.fase+=this.vel; this.y+=this.vy; this.x+=this.vx+Math.sin(this.fase)*this.deriva*.05;
    this.a=.25+Math.abs(Math.sin(this.fase))*.75;
    if(this.y<-20*dpr||this.x<-30*dpr||this.x>W+30*dpr) this.reset(false); }
  draw(){ ctx.globalAlpha=this.a; ctx.beginPath(); ctx.arc(this.x,this.y,this.r,0,7);
    ctx.fillStyle=this.color; ctx.shadowBlur=14*dpr; ctx.shadowColor=this.color; ctx.fill(); }
}

/* ── pétalos girando ── */
class Petalo{
  constructor(){this.reset(true)}
  reset(inicio){ this.x=rnd(0,W); this.y=inicio?rnd(0,H):H+40*dpr;
    this.s=rnd(5,12)*dpr; this.vy=-rnd(.2,.5)*dpr; this.vx=rnd(-.3,.3)*dpr;
    this.rot=rnd(0,7); this.vr=rnd(-.02,.02); this.a=rnd(.15,.45); }
  update(){ this.y+=this.vy; this.x+=this.vx; this.rot+=this.vr; if(this.y<-40*dpr)this.reset(false); }
  draw(){ ctx.save(); ctx.globalAlpha=this.a; ctx.translate(this.x,this.y); ctx.rotate(this.rot);
    const g=ctx.createLinearGradient(0,-this.s,0,this.s); g.addColorStop(0,'#fff3b0'); g.addColorStop(1,'#ffa000');
    ctx.fillStyle=g; ctx.shadowBlur=12*dpr; ctx.shadowColor='#ffc04d';
    ctx.beginPath(); ctx.ellipse(0,0,this.s*.42,this.s,0,0,7); ctx.fill(); ctx.restore(); }
}

/* ── estrellas fugaces ── */
class Fugaz{
  constructor(){this.activa=false;this.t=rnd(200,900)}
  update(){ if(!this.activa){ if(--this.t<=0){ this.activa=true; this.x=rnd(W*.1,W*.9); this.y=rnd(0,H*.35);
      this.len=rnd(120,320)*dpr; this.v=rnd(8,15)*dpr; this.a=1; } return; }
    this.x+=this.v; this.y+=this.v*.35; this.a-=.012;
    if(this.a<=0){this.activa=false;this.t=rnd(300,1100);} }
  draw(){ if(!this.activa)return; ctx.save(); ctx.globalAlpha=Math.max(this.a,0);
    const g=ctx.createLinearGradient(this.x,this.y,this.x-this.len,this.y-this.len*.35);
    g.addColorStop(0,'#ffffff'); g.addColorStop(.4,'rgba(255,212,71,.6)'); g.addColorStop(1,'transparent');
    ctx.strokeStyle=g; ctx.lineWidth=2*dpr; ctx.lineCap='round'; ctx.shadowBlur=18*dpr; ctx.shadowColor='#ffd447';
    ctx.beginPath(); ctx.moveTo(this.x,this.y); ctx.lineTo(this.x-this.len,this.y-this.len*.35); ctx.stroke(); ctx.restore(); }
}

/* ── chispas al tocar ── */
const chispas=[];
function estallar(x,y){
  for(let i=0;i<26;i++){ const a=rnd(0,7),v=rnd(1,6)*dpr;
    chispas.push({x:x*dpr,y:y*dpr,vx:Math.cos(a)*v,vy:Math.sin(a)*v,r:rnd(1,3.5)*dpr,a:1,
      c:TONOS[(Math.random()*TONOS.length)|0]}); }
}
addEventListener('pointerdown',e=>estallar(e.clientX,e.clientY));

const polen=Array.from({length:160},()=>new Polen(true));
const petalos=Array.from({length:26},()=>new Petalo());
const fugaces=[new Fugaz(),new Fugaz()];

function animar(){
  ctx.clearRect(0,0,W,H);
  ctx.globalCompositeOperation='lighter';
  polen.forEach(p=>{p.update();p.draw()});
  petalos.forEach(p=>{p.update();p.draw()});
  fugaces.forEach(f=>{f.update();f.draw()});
  for(let i=chispas.length-1;i>=0;i--){ const c=chispas[i];
    c.x+=c.vx; c.y+=c.vy; c.vy+=.06*dpr; c.vx*=.985; c.vy*=.985; c.a-=.018;
    if(c.a<=0){chispas.splice(i,1);continue}
    ctx.globalAlpha=c.a; ctx.beginPath(); ctx.arc(c.x,c.y,c.r,0,7);
    ctx.fillStyle=c.c; ctx.shadowBlur=16*dpr; ctx.shadowColor=c.c; ctx.fill(); }
  ctx.globalCompositeOperation='source-over'; ctx.globalAlpha=1;
  requestAnimationFrame(animar);
}
animar();

/* ── parallax suave ── */
const fondo=document.getElementById('fondo');
addEventListener('pointermove',e=>{
  const x=(e.clientX/innerWidth-.5), y=(e.clientY/innerHeight-.5);
  fondo.style.transform=`scale(1.08) translate3d(${-x*18}px,${-y*14}px,0)`;
});
</script>
</body>
</html>
