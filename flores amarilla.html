<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaxia de Flores Amarillas 🌟🌻</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #05050d;
            font-family: 'Arial', sans-serif;
        }

        /* Contenedor principal de fondo */
        .background-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('galaxia_flores.jpg') no-repeat center center/cover;
            filter: brightness(0.9);
            z-index: 1;
        }

        /* Canvas para las partículas/flores estelares */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        /* Mensaje central */
        .content {
            position: relative;
            z-index: 3;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #ffffff;
            text-align: center;
            padding: 20px;
        }

        h1 {
            font-size: 3rem;
            color: #ffeb3b;
            text-shadow: 0 0 15px rgba(255, 235, 59, 0.8), 0 0 30px rgba(255, 193, 7, 0.6);
            margin-bottom: 15px;
            animation: pulse 3s infinite alternate;
        }

        p {
            font-size: 1.3rem;
            color: #fff8e1;
            max-width: 600px;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
            line-height: 1.6;
        }

        @keyframes pulse {
            0% { transform: scale(1); text-shadow: 0 0 15px rgba(255, 235, 59, 0.8); }
            100% { transform: scale(1.05); text-shadow: 0 0 25px rgba(255, 235, 59, 1); }
        }
    </style>
</head>
<body>

    <!-- Imagen de fondo -->
    <div class="background-container"></div>

    <!-- Capa de partículas de luz/flores -->
    <canvas id="galaxyCanvas"></canvas>

    <!-- Texto superpuesto opcional -->
    <div class="content">
        <h1>Para Alguien Especial ✨🌻</h1>
        <p>En el universo de las cosas hermosas, tú brillas como una galaxia hecha de flores amarillas.</p>
    </div>

    <script>
        const canvas = document.getElementById('galaxyCanvas');
        const ctx = canvas.getContext('2d');

        let particles = [];
        const numParticles = 120;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Clase para las partículas brillantes de color amarillo
        class YellowStar {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 3 + 1;
                this.speedY = -(Math.random() * 0.5 + 0.1);
                this.speedX = Math.sin(Math.random() * Math.PI) * 0.3;
                this.opacity = Math.random();
                this.pulseSpeed = Math.random() * 0.02 + 0.005;
                // Tonos de amarillo y dorado
                const yellowColors = ['#fff176', '#ffee58', '#fdd835', '#ffb300', '#ffffff'];
                this.color = yellowColors[Math.floor(Math.random() * yellowColors.length)];
            }

            update() {
                this.y += this.speedY;
                this.x += this.speedX;
                this.opacity += this.pulseSpeed;

                if (this.opacity > 1 || this.opacity < 0.2) {
                    this.pulseSpeed = -this.pulseSpeed;
                }

                if (this.y < 0) {
                    this.y = canvas.height;
                    this.x = Math.random() * canvas.width;
                }
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = Math.abs(this.opacity);
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.restore();
            }
        }

        function init() {
            particles = [];
            for (let i = 0; i < numParticles; i++) {
                particles.push(new YellowStar());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }

        init();
        animate();
    </script>
</body>
</html>
